name: Build & Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore GameDock.sln

      - name: Build
        run: dotnet build GameDock.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/GameDock.Core.Tests/GameDock.Core.Tests.csproj -c Release --no-restore --no-build
